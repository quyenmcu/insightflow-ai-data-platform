name: Pipeline tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify independent streaming replay and recovery
        run: python -m unittest discover -s streaming/tests -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure disposable test environment
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build ingestion image
        run: docker compose build ingestion

      - name: Run integration tests
        run: >-
          docker compose run --rm
          -v "$PWD/tests:/app/tests:ro"
          -v "$PWD/infrastructure:/app/infrastructure:ro"
          ingestion python -m pytest -q -p no:cacheprovider /app/tests

      - name: Stop test services
        if: always()
        run: docker compose down --volumes --remove-orphans

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked app dependencies
        run: pnpm install --frozen-lockfile
      - name: Check dashboard logic and snapshot
        run: node --test dashboard/tests/*.test.mjs agent/tests/*.test.mjs
      - name: Build the hosted application
        run: pnpm build
